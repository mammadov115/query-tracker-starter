<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Query Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="css/dashboard.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base:    '#0f1117',
            surface: '#1a1d27',
            border:  '#2a2d3a',
            accent:  '#6366f1',
            ok:      '#22c55e',
            warn:    '#f59e0b',
            danger:  '#ef4444',
            muted:   '#6b7280',
            text:    '#e2e8f0',
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            ui:   ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="bg-base text-text font-ui min-h-screen">

  <!-- header -->
  <header class="border-b border-border px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-accent font-mono text-lg font-medium">query-tracker</span>
      <span class="text-muted text-sm">/ request traces</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="trace-count" class="text-muted text-sm font-mono">0 traces</span>
      <span id="refresh-indicator" class="text-muted text-xs">auto-refresh 5s</span>
      <button id="btn-clear"
        class="px-3 py-1.5 text-sm border border-border text-muted hover:border-danger hover:text-danger transition-colors duration-150">
        clear
      </button>
    </div>
  </header>

  <!-- stats bar -->
  <div id="stats-bar" class="border-b border-border px-6 py-3 grid grid-cols-4 gap-6">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-label">total requests</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-avg-duration">0ms</div>
      <div class="stat-label">avg duration</div>
    </div>
    <div class="stat-card">
      <div class="stat-value text-danger" id="stat-nplus1">0</div>
      <div class="stat-label">N+1 detected</div>
    </div>
    <div class="stat-card">
      <div class="stat-value text-warn" id="stat-duplicates">0</div>
      <div class="stat-label">duplicate queries</div>
    </div>
  </div>

  <!-- table -->
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-border text-muted text-xs font-mono uppercase tracking-wider">
          <th class="px-6 py-3 text-left w-16">method</th>
          <th class="px-6 py-3 text-left">uri</th>
          <th class="px-6 py-3 text-left w-20">status</th>
          <th class="px-6 py-3 text-right w-28">duration</th>
          <th class="px-6 py-3 text-right w-24">queries</th>
          <th class="px-6 py-3 text-left w-32">flags</th>
          <th class="px-6 py-3 text-left w-36">time</th>
        </tr>
      </thead>
      <tbody id="trace-tbody">
        <tr id="empty-row">
          <td colspan="7" class="px-6 py-16 text-center text-muted font-mono text-sm">
            no traces yet - make some requests
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
