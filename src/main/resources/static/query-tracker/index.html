<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Query Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="16" height="16" rx="3" stroke="#6366f1" stroke-width="1.5"/>
          <path d="M5 9h8M9 5v8" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">QueryTracker</span>
      <span class="logo-sub">SQL request traces</span>
    </div>
    <div class="topbar-right">
      <button class="btn-outline" id="btn-live">
        <span class="live-dot"></span> LIVE DASHBOARD
      </button>
      <button class="btn-primary" id="btn-refresh">REFRESH</button>
    </div>
  </header>

  <!-- REQUEST LIST PAGE -->
  <div id="page-list">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">Request List</h1>
        <div class="page-subtitle" id="list-subtitle">0 of 0 requests</div>
      </div>
      <div class="page-header-right">
        <div id="badge-nplus1" class="badge badge-warn hidden"></div>
        <div id="badge-dup" class="badge badge-danger hidden"></div>
      </div>
    </div>

    <!-- stats row -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">REQUESTS</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-queries">0</div>
        <div class="stat-label">QUERIES</div>
      </div>
      <div class="stat-box">
        <div class="stat-num text-warn" id="stat-nplus1">0</div>
        <div class="stat-label">N+1</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-total-dur">0ms</div>
        <div class="stat-label">TOTAL TIME</div>
      </div>
    </div>

    <!-- toolbar -->
    <div class="toolbar">
      <input class="search-input" id="search" placeholder="Search endpoint, method, trace..." />
      <label class="nplus1-check">
        <input type="checkbox" id="filter-nplus1"/> N+1 only
      </label>
      <div class="auto-refresh-wrap">
        Auto refresh
        <select id="refresh-interval" class="select-sm">
          <option value="0">Manual</option>
          <option value="5000" selected>5s</option>
          <option value="10000">10s</option>
          <option value="30000">30s</option>
        </select>
      </div>
      <button class="btn-primary btn-sm" id="btn-run">RUN QUERY</button>
    </div>

    <!-- table -->
    <div class="table-wrap">
      <table class="req-table">
        <thead>
          <tr>
            <th>REQUEST</th>
            <th>STARTED</th>
            <th>QUERIES</th>
            <th>DURATION</th>
            <th class="th-issues" id="th-issues">ISSUES <span class="sort-arrow">↕</span></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="req-tbody"></tbody>
      </table>
      <div id="empty-state" class="empty-state">no traces yet - make some requests</div>
    </div>
  </div>

  <!-- INSPECT PAGE -->
  <div id="page-inspect" class="hidden">
    <div class="inspect-topbar">
      <button class="btn-back" id="btn-back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="inspect-meta">
        <span class="method-badge" id="inspect-method"></span>
        <span class="inspect-uri" id="inspect-uri"></span>
      </div>
      <div id="inspect-flags" class="inspect-flags"></div>
    </div>

    <div class="inspect-summary">
      <span class="inspect-meta-line" id="inspect-meta-line"></span>
    </div>

    <!-- inspect stats -->
    <div class="inspect-stats">
      <div class="istat">
        <div class="istat-num" id="istat-queries">0</div>
        <div class="istat-label">QUERIES</div>
      </div>
      <div class="istat">
        <div class="istat-num text-warn" id="istat-slow">0</div>
        <div class="istat-label">SLOW &gt; 50ms</div>
      </div>
      <div class="istat">
        <div class="istat-num text-danger" id="istat-dup">0</div>
        <div class="istat-label">DUPLICATE SQLS</div>
      </div>
      <div class="istat">
        <div class="istat-num text-accent" id="istat-db-time">0ms</div>
        <div class="istat-label">DB TIME</div>
      </div>
      <div class="istat">
        <div class="istat-num" id="istat-total">0ms</div>
        <div class="istat-label">OVERALL</div>
      </div>
    </div>

    <!-- query list -->
    <div class="query-list" id="query-list"></div>

    <!-- detail panel -->
    <div class="detail-panel" id="detail-panel"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/list.js"></script>
  <script src="js/inspect.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
